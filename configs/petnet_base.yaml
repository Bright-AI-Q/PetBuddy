model:
  stage_repeats: [2, 3, 4]
  attn_cfg:
    enable: true
    pos_enc: "relative"
    eca_kernel: 3
  selfkd_cfg:
    enable: true
    T: 4
    w: [0.5, 0.3, 0.2]
    alpha: 0.999

train:
  batch_size: 16    # Batch size for training aad batch szie when you have gpu resources
  learning_rate: 0.003
  num_epochs: 120
  optimizer: "adamw"
  weight_decay: 0.00004
  warmup_epochs: 5
  patience: 10     # Early stopping patience (number of epochs without improvement)
  min_delta: 0.1   # Minimum improvement threshold (percentage)
  label_smoothing: 0.1  # <-- ADD THIS LINE
  gradient_accumulation_steps: 1 # accumulate gradients over these number of steps, minor optimization

data:
  dataset: "pet_cls_training"
  root_dir: "data/pet_cls_training"
  num_workers: 8    # data loader workers
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1
  input_size: [224, 224]
  ldre_cfg:
    enable: true
    prob: 0.5
    grid_size: 16
    drop_count: 2

evaluation:
  metrics: ["accuracy", "precision", "recall", "f1"]
  save_confusion_matrix: true

logging:
  log_dir: "runs/petnet_cls"
  save_checkpoints: true
  checkpoint_freq: 10
  tensorboard: true
