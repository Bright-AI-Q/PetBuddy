model:
  stage_repeats: [2, 3, 4]
  attn_cfg:
    enable: False
  selfkd_cfg:
    enable: True
    T: 4
    w: [0.5, 0.3, 0.2]
    alpha: 0.999

train:
  batch_size: 16
  learning_rate: 0.003
  num_epochs: 120
  optimizer: "adamw"
  weight_decay: 0.00004
  warmup_epochs: 5
  patience: 10
  min_delta: 0.1
  label_smoothing: 0.1  # <-- ADD THIS LINE

data:
  dataset: "pet_cls_training"
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1
  input_size: [224, 224]
  ldre_cfg:
    enable: True
    prob: 0.5
    grid_size: 16
    drop_count: 2

evaluation:
  metrics: ['accuracy', 'precision', 'recall', 'f1']
  save_confusion_matrix: True

logging:
  log_dir: "runs/petnet_cls"
  save_checkpoints: True
  checkpoint_freq: 10
  tensorboard: True
